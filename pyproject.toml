[project]
name = "wmj"
version = "0.1.0"
description = "World Model Judge — a checker for learned simulators"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: full-scale benchmark run (~90 s); run with `pytest -m slow`",
]
